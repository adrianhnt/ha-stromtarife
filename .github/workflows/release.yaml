name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub-Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version im Manifest prüfen
        run: |
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/strom_tarife/manifest.json'))['version'])")
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Manifest-Version $manifest"
            exit 1
          fi
      - name: Release-Notes aus CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?([ ]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Kein Abschnitt für $version in CHANGELOG.md"
            exit 1
          fi
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
